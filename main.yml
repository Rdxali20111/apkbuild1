name: Build SelfBuy Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Unsigned Release APK
        run: gradle assembleRelease --no-daemon

      - name: Generate Keystore & Sign APK
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BUILD_TOOLS=$(ls -d "$SDK_DIR"/build-tools/* | sort -V | tail -n 1)
          keytool -genkeypair -v -keystore selfbuy.jks -keyalg RSA -keysize 2048 -validity 10000 -alias selfbuy -storepass selfbuy123 -keypass selfbuy123 -dname "CN=SelfBuy, OU=App, O=AgentK, L=Sindh, S=Sindh, C=PK"
          "$BUILD_TOOLS/zipalign" -v -p 4 app/build/outputs/apk/release/app-release-unsigned.apk SelfBuy-Aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks selfbuy.jks --ks-key-alias selfbuy --ks-pass pass:selfbuy123 --key-pass pass:selfbuy123 --out SelfBuy-Release.apk SelfBuy-Aligned.apk

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SelfBuy-Release-APK
          path: SelfBuy-Release.apk
